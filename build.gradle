plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {


    implementation platform('org.junit:junit-bom:5.14.0')
    implementation 'org.junit.jupiter:junit-jupiter'

    // Генератор случайных данных Datafaker
    implementation 'net.datafaker:datafaker:2.5.4'

    // Библиотека для генерации ASCII-арта JFiglet
    implementation 'com.github.lalyos:jfiglet:0.0.8'

    //Библиотеки Кукумбера
    testImplementation "io.cucumber:cucumber-java:7.18.0"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:7.18.0"

    //Библиотеки JUnit
    testImplementation "org.junit.platform:junit-platform-suite:1.10.3"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"

    // Source: https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation 'io.rest-assured:rest-assured:5.5.6'

    // Source: https://mvnrepository.com/artifact/org.hamcrest/hamcrest
    testImplementation 'org.hamcrest:hamcrest:3.0'

    // JAX-B dependencies for JDK 9+
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:2.3.2"
    implementation "org.glassfish.jaxb:jaxb-runtime:2.3.2"

    // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-databind
    implementation 'tools.jackson.core:jackson-databind:3.2.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}